services:
  agent:
    build: .
    image: notes-voice-agent
    env_file: .env.local
    environment:
      WORKSPACE_ROOT: /workspace
      # A different name from the LiveKit Cloud deployment, so a demo picks the local one
      AGENT_NAME: assistant-local
    volumes:
      # Any folder of Markdown or text files. Override with WORKSPACE_DIR=/path docker compose up
      - ${WORKSPACE_DIR:-./sample-workspace}:/workspace
    restart: unless-stopped
